<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Arc-reactor favicon: cyan core on the site's dark steel background -->
  <rect width="64" height="64" rx="14" fill="#0b1220"/>
  <g fill="none" stroke="#38e6f0">
    <!-- outer tick ring -->
    <circle cx="32" cy="32" r="25" stroke-width="2.5" stroke-dasharray="3 3.1" opacity="0.55"/>
    <!-- segmented mid ring -->
    <circle cx="32" cy="32" r="19" stroke-width="2.5" stroke-dasharray="11 4" opacity="0.85"/>
    <!-- triangle cage -->
    <polygon points="32,15 47,41 17,41" stroke-width="1.6" opacity="0.6"/>
  </g>
  <!-- core -->
  <circle cx="32" cy="32" r="9.5" fill="#38e6f0" opacity="0.28"/>
  <circle cx="32" cy="32" r="6" fill="#7ff6fb"/>
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
</svg>
